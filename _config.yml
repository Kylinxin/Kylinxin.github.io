title: Ky不是枕木
subtitle: 分享学习经验
description: 当你觉得生活都不顺心如意的时候，来学习pwn吧！
keywords:
author: Kylinxin
language: zh-CN
timezone: Asia/Shanghai

url: https://kylinxin.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

source_dir: source
public_dir: public
post_dir: _posts
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

index_generator:
  path: ''
  per_page: 7
  order_by: -date

archive_generator:
  per_page: 10
  yearly: true
  monthly: true
  daily: false

category_generator:
  per_page: 10

tag_generator:
  per_page: 10

feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
  content_limit: 0
  order_by: -date

sitemap:
  path: sitemap.xml

search:
  path: search.xml
  field: post
  content: true
  format: html

theme: next

deploy:
  type: ''
